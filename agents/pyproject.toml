[project]
name = "ai-service"
version = "0.1.0"
authors = [
    { name = "Nuttakarn P", email = "hazentio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "openai>=3.55.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "features"
namespace = true
